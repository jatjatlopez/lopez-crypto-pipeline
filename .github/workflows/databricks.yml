name: Databricks Pipeline

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  run-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Databricks CLI
        run: pip install databricks-sdk

      - name: Run Bronze → Silver → Gold
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from databricks.sdk import WorkspaceClient
          from databricks.sdk.service.compute import Environment
          from databricks.sdk.service.jobs import (
              GitSource,
              GitProvider,
              JobEnvironment,
              NotebookTask,
              Source,
              Task,
          )

          client = WorkspaceClient(
              host=os.environ["DATABRICKS_HOST"],
              token=os.environ["DATABRICKS_TOKEN"],
          )

          git_source = GitSource(
              git_url="https://github.com/jatjatlopez/lopez-crypto-pipeline.git",
              git_provider=GitProvider.GIT_HUB,
              git_branch="main",
          )

          serverless_env = [
              JobEnvironment(
                  environment_key="default",
                  spec=Environment(environment_version="3"),
              )
          ]

          notebooks = [
              "notebooks/01_bronze_layer",
              "notebooks/02_silver_layer",
              "notebooks/03_gold_layer",
          ]

          for path in notebooks:
              print(f"Running {path}...")
              run = client.jobs.submit(
                  run_name=f"github-actions-{path.split('/')[-1]}",
                  git_source=git_source,
                  environments=serverless_env,
                  tasks=[
                      Task(
                          task_key="notebook",
                          environment_key="default",
                          notebook_task=NotebookTask(
                              notebook_path=path,
                              source=Source.GIT,
                          ),
                      )
                  ],
              ).result()
              state = run.state.life_cycle_state if run.state else "unknown"
              print(f"Done: {path} ({state})")
          EOF
